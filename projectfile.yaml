$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-05-19"
  name: nginx
  summary:
    en: Community-maintained distribution of Nginx based on B19/GCC
    es: Distribución de Nginx mantenida por la comunidad, basada en B19/GCC
    uk: Дистрибуція Nginx з підтримкою спільноти на основі B19/GCC
  title: O9S / Nginx
  description:
    en: Community-maintained distribution of Nginx built on B19/GCC. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream Nginx is fetched at build time and retains its own licensing.
    es: Distribución de Nginx mantenida por la comunidad, construida sobre B19/GCC. Este repositorio contiene únicamente el empaquetado — Dockerfile, scripts de compilación y configuración, todo con licencia MIT; el código original de Nginx se obtiene en tiempo de compilación y conserva su propia licencia.
    uk: Дистрибуція Nginx з підтримкою спільноти, зібрана на основі B19/GCC. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код Nginx отримують під час збирання, і він зберігає власну ліцензію.
  version: 1.7.0
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/gcc.yaml
  - .makefile/b19/images/rust.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/container/traits/nginx.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/o9s/metadata/raw/branch/main/include.yaml
keywords:
  - nginx
  - web-server
  - reverse-proxy
  - http3
  - docker
kind: SoftwareSourceCode
org:
  projectfile:
    ci:
      nodes:
        # This project’s OWN container is always the nginx server, on every
        # plane, so the default (unmodified M6E_CONTAINER_INSTANCE) row from
        # nginx-gixy.yaml applies unchanged — no override needed here.
        container-ready-to-test:
          needs:
            gixy-checked: true
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
technologies:
  - c
links:
  - label:
      en: O9S / Nginx on kiota.ch
      es: O9S / Nginx en kiota.ch
      uk: O9S / Nginx на kiota.ch
    preferred: true
    type: source-code
    url: https://kiota.ch/o9s/nginx
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/o9s/nginx.git
