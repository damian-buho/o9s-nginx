      uk: Пакунки на Docker Hub
    type: package-registry
    url: https://hub.docker.com/r/damianbuho/o9s-nginx
org:
  projectfile:
    artifacts:
      nginx:
        kind: service
        summary:
          en: nginx web server
          es: Servidor web nginx
          uk: Вебсервер nginx
        ports:
          - port: 8080
            name: http
            path: /
            protocol: tcp
    architecture:
      - amd64
      - arm64
    ci:
      nodes:
        # This project’s OWN container is always the nginx server, on every
        # plane, so the default (unmodified M6E_CONTAINER_INSTANCE) row from
        # nginx-gixy.yaml applies unchanged — no override needed here.
        container-is-tested:
          needs:
            gixy-checked: true
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/o9s/nginx.git
