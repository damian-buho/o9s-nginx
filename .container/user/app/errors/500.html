<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --fg: #22223b;
            --accent: #4169e1;
            --shadow: 0 4px 32px 0 rgba(0,0,0,0.13);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #181a20;
                --fg: #e0e1dd;
                --accent: #7ab4ff;
                --shadow: 0 4px 32px 0 rgba(0,0,0,0.50);
            }
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            width: 100vw;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-container {
            background: var(--bg);
            box-shadow: var(--shadow);
            border-radius: 18px;
            padding: 2.5rem 2rem 1.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .error-code {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -1.5px;
            margin-bottom: 0.5em;
            font-family: inherit;
        }
        .error-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.2em;
            letter-spacing: -0.5px;
        }
        .error-desc {
            font-size: 1.08rem;
            color: var(--fg);
            margin-bottom: 1.2em;
            opacity: 0.86;
        }
        a { color: var(--accent);}
        @media (max-width: 520px) {
            .error-container {
                padding: 1.8rem 0.5rem 1.1rem 0.5rem;
                max-width: 97vw;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">500</div>
    <div class="error-title">Internal Server Error</div>
    <div class="error-desc">
        Sorry, something went wrong on our end.<br>
        Please try again later or return to the <a href="/">home page</a>.
    </div>
</div>
</body>
</html>
