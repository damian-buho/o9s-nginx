  name: nginx
  summary:
    en: Community-maintained distribution of Nginx based on B19/GCC
    es: Distribución de Nginx mantenida por la comunidad, basada en B19/GCC
    uk: Дистрибуція Nginx з підтримкою спільноти на основі B19/GCC
  title: O9S / Nginx
  description:
    en: Nginx compiled from source with HTTP/3, brotli and zstd — every directive set by environment variable, with optional ACME, OpenTelemetry and security-header modules.
